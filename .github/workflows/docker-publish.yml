# Сборка образа в GitHub Actions. На сервер уезжает уже готовый Docker image:
# без next build на прод-сервере и без docker pull из GHCR.

name: Publish and deploy solo-site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: solo-site-docker
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name (lowercase for GHCR)
        id: meta
        run: |
          OWNER_REPO_LOWER="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${REGISTRY}/${OWNER_REPO_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login "${REGISTRY}" -u '${{ github.actor }}' --password-stdin

      - name: Build image
        run: |
          docker build \
            -f ./Dockerfile \
            -t "${{ steps.meta.outputs.image }}:latest" \
            -t "${{ steps.meta.outputs.image }}:sha-${{ github.sha }}" \
            .

      - name: Push image
        run: |
          docker push "${{ steps.meta.outputs.image }}:latest"
          docker push "${{ steps.meta.outputs.image }}:sha-${{ github.sha }}"

      - name: Save image artifact for SSH deploy
        run: |
          docker save "${{ steps.meta.outputs.image }}:sha-${{ github.sha }}" | gzip > solo-site-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: solo-site-image
          path: solo-site-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy-demo:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Check deploy secrets
        id: deploy-secrets
        env:
          DEMO_SSH_HOST: ${{ secrets.DEMO_SSH_HOST }}
          DEMO_SSH_PORT: ${{ secrets.DEMO_SSH_PORT }}
          DEMO_SSH_USER: ${{ secrets.DEMO_SSH_USER }}
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
        run: |
          echo "port=${DEMO_SSH_PORT:-22}" >> "$GITHUB_OUTPUT"

          if [ -n "$DEMO_SSH_HOST" ] && [ -n "$DEMO_SSH_USER" ] && [ -n "$DEMO_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH agent
        if: steps.deploy-secrets.outputs.enabled == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEMO_SSH_KEY }}

      - name: Add VPS to known_hosts
        if: steps.deploy-secrets.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh
          host="${{ secrets.DEMO_SSH_HOST }}"
          port="${{ steps.deploy-secrets.outputs.port }}"
          tmpfile="$(mktemp)"

          for attempt in 1 2 3; do
            ssh-keyscan -T 15 -H -p "$port" "$host" >"$tmpfile" 2>/dev/null || true

            if [ -s "$tmpfile" ]; then
              cat "$tmpfile" >> ~/.ssh/known_hosts
              break
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done

          if [ ! -s "$tmpfile" ]; then
            echo "ssh-keyscan did not return any host keys for $host:$port" >&2
            exit 1
          fi

      - name: Debug SSH target
        if: steps.deploy-secrets.outputs.enabled == 'true'
        run: |
          echo "host=${{ secrets.DEMO_SSH_HOST }}"
          echo "port=${{ steps.deploy-secrets.outputs.port }}"
          echo "user=${{ secrets.DEMO_SSH_USER }}"

      - name: Download image artifact
        if: steps.deploy-secrets.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: solo-site-image

      - name: Upload image to VPS
        if: steps.deploy-secrets.outputs.enabled == 'true'
        run: |
          scp \
            -P "${{ steps.deploy-secrets.outputs.port }}" \
            solo-site-image.tar.gz \
            "${{ secrets.DEMO_SSH_USER }}@${{ secrets.DEMO_SSH_HOST }}:/tmp/solo-site-image-${{ github.sha }}.tar.gz"

      - name: Deploy loaded image over SSH
        if: steps.deploy-secrets.outputs.enabled == 'true'
        run: |
          ssh \
            -vvv \
            -p "${{ steps.deploy-secrets.outputs.port }}" \
            "${{ secrets.DEMO_SSH_USER }}@${{ secrets.DEMO_SSH_HOST }}" \
            "set -euo pipefail
            image='${{ needs.build-and-push.outputs.image }}'
            sha='${{ github.sha }}'
            tarball=\"/tmp/solo-site-image-${{ github.sha }}.tar.gz\"
            gzip -dc \"\$tarball\" | docker load
            docker tag \"\$image:sha-\$sha\" \"\$image:latest\"
            rm -f \"\$tarball\"
            cd /opt/beget/n8n
            docker compose --project-directory /opt/beget/n8n -f docker-compose.solo-site.yml up -d solo-site
            docker compose --project-directory /opt/beget/n8n -f docker-compose.solo-site.yml ps solo-site
            docker compose --project-directory /opt/beget/n8n -f docker-compose.solo-site.yml logs --tail=60 solo-site"

      - name: Skip deploy when SSH secrets are missing
        if: steps.deploy-secrets.outputs.enabled != 'true'
        run: echo "Skipping deploy-demo because required SSH secrets are not configured."
